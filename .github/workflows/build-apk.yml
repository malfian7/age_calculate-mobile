name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: flutter create . --platforms=android --project-name age_calculate --org app.agecalculate

      - name: Remove default sample test
        run: rm -f test/widget_test.dart

      - name: Set launcher name
        run: sed -i 's/android:label="[^"]*"/android:label="Age Calculate"/' android/app/src/main/AndroidManifest.xml

      # The committed lockfile was made with a different Flutter version; let pub resolve fresh.
      - name: Get packages
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze (informational)
        run: flutter analyze lib || true

      - name: Unit tests (age logic)
        run: flutter test test/age_test.dart

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: age-calculate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
